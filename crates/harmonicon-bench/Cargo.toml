[package]
name = "harmonicon-bench"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Developer tooling, not shipped game code: replays recordings through every
# detection algorithm and scores hits/misses/phantoms, plus the synthetic
# dataset generator that stands in until real recordings exist.
#
# Bevy-free on purpose. Improving detection quality means running this loop
# over and over, and it is worth having in seconds rather than behind an
# engine build.
[dependencies]
harmonicon-core = { path = "../harmonicon-core" }
harmonicon-dsp = { path = "../harmonicon-dsp" }
serde_json = { workspace = true }

# Timing benchmarks for the Bevy-free hot paths live here rather than in
# harmonicon-core/-dsp, so Criterion never enters those crates' test builds.
[dev-dependencies]
criterion = { workspace = true }
# Only the score_import bench reads score files.
harmonicon-score = { path = "../harmonicon-score" }

[[bench]]
name = "detectors"
harness = false

[[bench]]
name = "core_hot_paths"
harness = false

[[bench]]
name = "score_import"
harness = false

[lints]
workspace = true
